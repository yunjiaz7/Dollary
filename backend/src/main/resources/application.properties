spring.application.name=billingbook
server.port=8080

# PostgreSQL (Railway injects SPRING_DATASOURCE_* in production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/billingbook}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:billingbook}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:billingbook}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Session
server.servlet.session.timeout=7d

# Auth credentials (override via env vars in production)
app.username=${APP_USERNAME:admin}
app.password=${APP_PASSWORD:admin123}

# CORS (override in production via CORS_ALLOWED_ORIGINS env var)
cors.allowed-origins=http://localhost:5173

# Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
